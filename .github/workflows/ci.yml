name: CI

# 継続的検証ワークフロー。
#
# ジョブ構成:
# 1. `docs`: ドキュメント管理規則の検証 + 変更ファイルの判定（docs-only の場合は重いジョブをスキップ）
# 2. `lint`: 静的解析・フォーマットチェック
# 3. `test`: テストの実行
# 4. `build`: ビルドの検証
#
# PR の draft 中はジョブをスキップし、ready for review で走らせる。
# PR の push では古い実行をキャンセルする。

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_SHA: ${{ github.sha }}

jobs:
  docs:
    name: Docs & Change Filter
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify documentation rules (verify-docs.py)
        run: python3 docs/script/verify-docs.py

      - name: Detect whether code inputs changed
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"
          echo "$changed"
          code_changed=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/developers.md|docs/plans.md|docs/handoff.md|docs/history.md|docs/designs/*|docs/script/*|README.md|LICENSE|.github/workflows/*)
                ;;
              *)
                code_changed=true
                break
                ;;
            esac
          done <<< "$changed"
          echo "code_changed=$code_changed"
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint & Format
    needs: docs
    if: needs.docs.outputs.code_changed == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test
    needs: docs
    if: needs.docs.outputs.code_changed == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --locked --all-targets --no-fail-fast

  build:
    name: Build & Distribution Compatibility
    needs: docs
    if: needs.docs.outputs.code_changed == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Check glibc gate regression cases
        run: bash scripts/test-check-release.sh

      - name: Build distribution binary (glibc 2.35 baseline)
        run: cargo build --locked --profile release-dist --target x86_64-unknown-linux-gnu

      - name: Stage portable distribution
        run: |
          mkdir -p target/compatibility-package
          cp target/x86_64-unknown-linux-gnu/release-dist/llmsearch target/compatibility-package/
          cp -R assets target/compatibility-package/assets

      - name: Compatibility gate (Ubuntu 22.04 and 24.04)
        run: |
          if bash scripts/check-release.sh target/compatibility-package/llmsearch --containers > target/compatibility.log 2>&1; then
            cat target/compatibility.log
          else
            cat target/compatibility.log
            # annotations はログダウンロード不可の環境でも GitHub API から読める。
            details="$(tail -c 10000 target/compatibility.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=Distribution compatibility::$details"
            exit 1
          fi

      - name: Retain verified distribution binary
        uses: actions/upload-artifact@v4
        with:
          name: llmsearch-linux-gnu-compatibility
          path: target/compatibility-package/
          retention-days: 7
