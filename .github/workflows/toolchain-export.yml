name: toolchain-export

# 目的: Rust ツールチェーンと vendored crates を Git ブランチに退避する
# ---------------------------------------------------------------------
# Arena サンドボックスからは static.rust-lang.org / crates.io に到達できない。
# このワークフローは GitHub Actions 上で rustup + cargo vendor を実行し、
# その成果物を cache/rust-toolchain 孤立ブランチに push する。
#
# 使い方:
#   1. .github/toolchain.env の ENABLED=1 にして push（または手動実行）
#   2. Actions が sysroot + vendor を取得してブランチに push
#   3. サンドボックス側で bash scripts/bootstrap-rust.sh を実行
#   4. 完了後、ENABLED=0 に戻す
#
# 出力されるブランチ構成:
#   cache/rust-toolchain
#   ├── chunks/sysroot.tar.gz.aa  (45MB 分割)
#   ├── chunks/sysroot.tar.gz.ab
#   ├── chunks/vendor.tar.gz.aa
#   ├── chunks/vendor.tar.gz.ab
#   ├── SHA256SUMS
#   └── rust-version.txt

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"
    paths:
      - .github/toolchain.env

permissions:
  contents: write

concurrency:
  group: toolchain-export-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.90.0"  # プロジェクトの rust-toolchain.toml に合わせて調整
  TARGETS: "x86_64-unknown-linux-gnu,wasm32-unknown-unknown"
  COMPONENTS: "rustfmt,clippy"

jobs:
  export:
    name: Export Rust toolchain to cache branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check if enabled
        id: check
        shell: bash
        run: |
          set -euo pipefail
          . ./.github/toolchain.env
          if [ "${ENABLED:-0}" != "1" ] && [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ENABLED=0, skipping."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
            --default-toolchain "${{ env.RUST_VERSION }}" \
            --target ${{ env.TARGETS }} \
            --component ${{ env.COMPONENTS }}
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        if: steps.check.outputs.enabled == 'true'
        run: |
          rustc --version
          cargo --version
          rustc --print sysroot
          rustup target list --installed

      - name: Vendor dependencies
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/export/vendor-src
          cargo vendor --versioned-dirs /tmp/export/vendor-src
          echo "vendored $(ls /tmp/export/vendor-src | wc -l) crates"

      - name: Package sysroot
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          SYSROOT="$(rustc --print sysroot)"
          mkdir -p /tmp/export/chunks
          tar czf /tmp/export/sysroot.tar.gz -C "$SYSROOT" .
          echo "sysroot size: $(du -h /tmp/export/sysroot.tar.gz | cut -f1)"

      - name: Package vendor
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          tar czf /tmp/export/vendor.tar.gz -C /tmp/export vendor-src
          echo "vendor size: $(du -h /tmp/export/vendor.tar.gz | cut -f1)"

      - name: Split into chunks and compute checksums
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/export/chunks
          split -b 45m /tmp/export/sysroot.tar.gz /tmp/export/chunks/sysroot.tar.gz.
          split -b 45m /tmp/export/vendor.tar.gz /tmp/export/chunks/vendor.tar.gz.
          cd /tmp/export/chunks
          sha256sum * > SHA256SUMS
          echo "chunks:"
          ls -lh /tmp/export/chunks/
          cat SHA256SUMS

      - name: Record Rust version
        if: steps.check.outputs.enabled == 'true'
        run: |
          rustc --version > /tmp/export/rust-version.txt
          cat /tmp/export/rust-version.txt

      - name: Probe token write permission
        if: steps.check.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/probe && cd /tmp/probe
          echo "probe $(date -u +%FT%TZ)" > probe.txt
          git init -q
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout -q -b cache/probe
          git add -A
          git commit -q -m "probe"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git push --force origin cache/probe > /tmp/probe.log 2>&1; then
            msg="$(tr '\n' ' ' < /tmp/probe.log | tail -c 900)"
            echo "::error title=probe-push::${msg}"
            exit 1
          fi
          echo "probe push ok"

      - name: Push to cache/rust-toolchain
        if: steps.check.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # push 専用のクリーンなディレクトリを作る。
          # /tmp/export には vendor-src や tar.gz 本体が含まれ巨大なため、
          # 分割済みチャンクだけを退避対象にする。
          rm -rf /tmp/pushrepo
          mkdir -p /tmp/pushrepo
          cp -r /tmp/export/chunks /tmp/pushrepo/
          cp /tmp/export/SHA256SUMS /tmp/pushrepo/
          cp /tmp/export/rust-version.txt /tmp/pushrepo/
          cd /tmp/pushrepo
          du -sh .
          ls -l chunks | head

          git init -q
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout -q -b cache/rust-toolchain
          git add -A
          git -c user.email="actions@github.com" -c user.name="GitHub Actions" \
              commit -q -m "toolchain: $(cat rust-version.txt)"
          git count-objects -vH
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config http.postBuffer 524288000
          git config http.version HTTP/1.1

          status=0
          git push --force --progress origin cache/rust-toolchain > /tmp/tc_push.log 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            # サンドボックスからは Actions のログ API に到達できないため、
            # 診断ログを小さなブランチに載せて運ぶ（小さな push は成功する）。
            {
              echo "toolchain push status=$status"
              echo "--- pushrepo ---"
              du -sh /tmp/pushrepo; ls -l /tmp/pushrepo/chunks
              echo "--- log ---"
              tail -c 4000 /tmp/tc_push.log
            } > /tmp/diag.txt 2>&1
            rm -rf /tmp/diagrepo && mkdir -p /tmp/diagrepo && cp /tmp/diag.txt /tmp/diagrepo/
            cd /tmp/diagrepo
            git init -q
            git checkout -q -b cache/diag
            git add -A
            git -c user.email="actions@github.com" -c user.name="GitHub Actions" commit -q -m "diag"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push --force origin cache/diag > /dev/null 2>&1 || true
            echo "::error title=push-failed::git push が exit $status で失敗した"
            exit "$status"
          fi
          echo "Pushed to cache/rust-toolchain"
          PR=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${GITHUB_REF_NAME}" --state all --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$PR" ]; then gh pr comment "$PR" --repo "${GITHUB_REPOSITORY}" --body "toolchain-export: $(cat rust-version.txt) を cache/rust-toolchain に push" || true; fi
          echo "toolchain-export 完了" >> "$GITHUB_STEP_SUMMARY"
