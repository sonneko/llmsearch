name: Release

# タグ（vX.Y.Z）の push で、Linux x86_64 の実行ファイル 1 種類をビルドしてリリースへ添付する。
# 仕様: 単一バイナリ配布（REF:docs/developers.md §2.1）。
#
# 使い方:
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "既存のタグ名（例: v0.1.0）"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BIN: llmsearch
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    name: Build & Release (Linux x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --profile release-dist --target "$TARGET"

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            version="${{ github.event.inputs.tag }}"
          fi
          name="${BIN}-${version}-${TARGET}"
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release-dist/${BIN}" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          cp -R assets "dist/${name}/assets"
          ( cd dist && tar -czf "${name}.tar.gz" "${name}" )
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          echo "ARTIFACT=dist/${name}.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKSUM=dist/${name}.tar.gz.sha256" >> "$GITHUB_ENV"

      # アーカイブに入った実ファイルを検証してから公開する。
      - name: Compatibility gate (glibc 2.35, Ubuntu 22.04 and 24.04)
        run: |
          set -euo pipefail
          mkdir -p target/release-smoke
          tar -xzf "$ARTIFACT" -C target/release-smoke
          binary="$(find target/release-smoke -type f -name "$BIN")"
          bash scripts/check-release.sh "$binary" --containers

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ env.ARTIFACT }}
            ${{ env.CHECKSUM }}
